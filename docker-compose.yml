services:
  auth-service:
    build: ./back-end/auth-service
#    ports:
#      - "8080:8080" development
    expose:
      - 8080
    env_file:
      - ./back-end/auth-service/.env
    networks:
      - private
    restart: on-failure
    depends_on:
      - db
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-fumi
#    ports:
#      - "15672:15672" development
    expose:
      - 15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - private

  lambda-bridge:
    build: ./back-end/python-bridge-lambda
    container_name: lambda-bridge-fumi
    env_file:
      - ./back-end/python-bridge-lambda/.env
    depends_on:
      - rabbitmq
    restart: on-failure
    networks:
      - private
  
  db:
    image: postgres:15-alpine
    restart: always
#    ports:
#      - "5433:5432" development
    expose:
      - 5432
    networks:
      - private
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  products-service:
    build: ./back-end/products-service
#    ports:
#      - "8081:8080" development
    expose:
      - 8080
    env_file:
      - ./back-end/products-service/.env
    networks:
      - private
    depends_on:
      - db
      
  user-related-service:
    build: ./back-end/user-related-service
#    ports:
#      - "8082:8080" development
    expose:
      - 8080
    env_file:
      - ./back-end/user-related-service/.env
    networks:
      - private
    restart: on-failure
    depends_on:
      - db
      - redis
      - rabbitmq

  cart-service:
    build: ./back-end/cart-service
#    ports:
#      - "8083:8080" development
    expose:
      - 8080
    env_file:
      - ./back-end/cart-service/.env
    networks:
      - private
    restart: on-failure
    depends_on:
      - db
      
  redis:
    image: redis:7-alpine
    container_name: redis-fumi
#    ports:
#      - "6379:6379" development
    expose:
      - 6379
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    networks:
      - private

  frontend:
    build: ./front-end
#    ports:
#      - "3000:80" development
    expose:
      - 80
    networks:
      - private
      - public
    env_file:
      - ./front-end/.env
    restart: on-failure
    depends_on:
      - auth-service
      - products-service
      - user-related-service
      - cart-service
      
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy-fumi
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/:/etc/nginx/conf.d/
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/html
    networks:
      - private
      - public
    depends_on:
      - frontend
      
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/html
    command: certonly --webroot --webroot-path=/var/www/html --email vinches504@gmail.com --agree-tos --no-eff-email -d fumi.artorien.me -d www.fumi.artorien.me -d fumi.egreg.xyz


networks:
  private:
    driver: bridge
  public:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  certbot-etc:
  certbot-var:
  web-root:

